# 1536M is not enough for an AGP 9 / Gradle 9 build; the heap was sized for AGP 3.3
# and four fewer major versions of the dexing and resource pipelines.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# Kept on deliberately. Nothing in the current dependency set obviously needs
# jetifying now that the androidTest dependencies are AndroidX, but turning it off
# is only provably safe against a real resolution run, and this environment has no
# JDK or Android SDK to do one with. Worth removing as a build-time win once
# someone can confirm a clean resolve without it.
android.enableJetifier=true

# AGP 9 flags, matching the current Flutter template.
#
# newDsl=false keeps the classic DSL. AGP 9 ships a new one, and this project's
# Groovy files are written against the classic android { } shape.
android.newDsl=false
# builtInKotlin=false means we keep applying the Kotlin plugin ourselves via
# `id "kotlin-android"`, rather than using AGP 9's built-in Kotlin support.
android.builtInKotlin=false

# android.enableR8=true was removed. R8 became the default (and only) shrinker back
# in AGP 7, so the flag has been a no-op since then and is no longer recognised.
