# Beta release entrypoint.
#
# Matches `beta-*` tags (created by tag.yml) and delegates the entire pipeline to
# the reusable deploy workflow. The only difference from production is the Play
# track and that no GitHub Pages publish happens.
#
# See docs/release-flow.md.
name: releasebeta

on:
  push:
    tags:
      - "beta-*"

jobs:
  release:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      publish-web: false
      google-play-track: beta
    secrets: inherit
