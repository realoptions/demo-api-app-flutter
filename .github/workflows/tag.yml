# Creates the release / beta tags that drive deployment.
#
# This workflow does not deploy anything. It runs the test suite, reads the
# semantic version out of pubspec.yaml, and pushes `release-<version>` (master)
# or `beta-<version>` (any other branch). deploybeta.yaml / deployprod.yaml
# match those tags and hand off to .github/workflows/deploy-reusable.yml.
#
# See docs/release-flow.md for the whole flow and for why the build number is
# not part of pubspec.yaml.
name: tagtest
on:
  push:
    tags-ignore:
      - '*.*'
    branches:
      - '**'

jobs:
  tag:
    runs-on: ubuntu-latest
    # Creates a build matrix for your jobs. You can define different
    # variations of an environment to run each job in.
    steps:
    # A name for your step to display on GitHub.
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'
    # Sets up a flutter environment.
    # https://github.com/marketplace/actions/flutter-action
    - uses: subosito/flutter-action@v2
      with:
        # Kept in step with the release pipeline's default (see
        # .github/workflows/deploy-reusable.yml) and .metadata. The previous 2.x
        # pin has been out of support for years and cannot resolve this project's
        # Dart 3 dependency set.
        #
        # `cache: true` caches both the Flutter SDK and the pub dependencies -
        # the action's step guard is `(pub-cache == '' && cache == 'true') ||
        # pub-cache == 'true'`, so leaving `pub-cache` unset still caches them.
        # This job runs on every push to every branch and used to re-download
        # the whole dependency set each time.
        flutter-version: '3.47.4'
        channel: 'stable'
        cache: true
    - name: "Run Flutter Driver tests"
      # The Codecov token is exposed as an environment variable only. The uploader
      # reads CODECOV_TOKEN itself, so the value never has to appear in the
      # command line (where it would sit in the script text and in `ps` output).
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        flutter pub get
        flutter clean
        flutter test --coverage
        bash <(curl -s https://codecov.io/bash)
    # The app version, not the SDK version. The pattern is anchored at column 0
    # on purpose: `version:` is a top-level pubspec key, so anchoring both
    # matches it exactly and cannot pick up an indented `version:` under a
    # dependency. The old `cut -c 10-` was positional and broke if the line was
    # ever reindented. An empty result is a hard failure: an empty version
    # would have produced a tag like `release-` that still matches `release-*`
    # and deploys a build whose version nobody chose.
    - name: read app version from pubspec
      run: |
        APP_VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | tail -n1)
        if [ -z "$APP_VERSION" ]; then
          echo "::error::could not read a version from pubspec.yaml"
          exit 1
        fi
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
    - name: get branch name
      run: echo "BRANCH_NAME=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
    # The branch name is attacker-influenced text (a branch can be named almost
    # anything), so it reaches the shell through an env mapping and is quoted
    # everywhere it is used - never interpolated into the script body.
    - name: get branch tag
      env:
        BRANCH_NAME: ${{ env.BRANCH_NAME }}
        APP_VERSION: ${{ env.APP_VERSION }}
      run: |
        # A shell-local variable, deliberately: values appended to $GITHUB_ENV
        # are not visible to the rest of the same step, so reading $RELEASE_TAG
        # back here would have yielded an empty string.
        if [ "$BRANCH_NAME" = master ]; then
          PREFIX=release
        else
          PREFIX=beta
        fi
        echo "RELEASE_TAG=$PREFIX" >> "$GITHUB_ENV"
        echo "CUSTOM_TAG=${PREFIX}-${APP_VERSION}" >> "$GITHUB_ENV"
    # `git tag | grep -q $TAG` treated the tag as a regex and let its contents
    # steer the command; an exact ref lookup answers the same question safely.
    - name: does tag exist
      env:
        CUSTOM_TAG: ${{ env.CUSTOM_TAG }}
      run: |
        if [ -n "$(git tag --list "$CUSTOM_TAG")" ]; then
          echo "TAG_DOES_NOT_EXIST=0" >> "$GITHUB_ENV"
        else
          echo "TAG_DOES_NOT_EXIST=1" >> "$GITHUB_ENV"
        fi
    # 1.34.0 (Jan 2021) was five years behind. CUSTOM_TAG is still honoured by
    # 1.75.0 and, as the README states, "setting this tag will invalidate any
    # other settings set" - which is why the old RELEASE_BRANCHES entry is gone:
    # it was already dead config under CUSTOM_TAG.
    - name: Bump version and push tag
      uses: anothrNick/github-tag-action@1.75.0
      if: env.TAG_DOES_NOT_EXIST=='1'
      env:
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        CUSTOM_TAG: ${{ env.CUSTOM_TAG }}
