# Production release entrypoint.
#
# Matches `release-*` tags (created by tag.yml on pushes to master) and delegates
# the entire pipeline to the reusable deploy workflow, additionally publishing the
# web demo to GitHub Pages with its API key injected.
#
# See docs/release-flow.md.
name: releaseprod

on:
  push:
    tags:
      - "release-*"

jobs:
  release:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      publish-web: true
      public-android: false
      google-play-track: production
    secrets: inherit
