# Reusable release workflow for the RealOptions Flutter app.
#
# This is the single implementation of the release pipeline. `deploybeta.yaml` and
# `deployprod.yaml` are thin callers that differ only in the tag they match and the
# values they pass in here. Previously both files carried a full copy of the
# pipeline, which meant any change had to be made twice and silently drifted.
#
# See docs/release-flow.md for the end-to-end release process.
#
# Callers MUST use `secrets: inherit`. The required repository secrets are listed
# in docs/release-flow.md.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      flutter-version:
        description: "Flutter SDK version used to build and test the release."
        type: string
        required: false
        default: "3.47.4"
      flutter-channel:
        description: "Flutter release channel."
        type: string
        required: false
        default: "stable"
      publish-web:
        description: >-
          Insert the web API key, build the web bundle and publish it to GitHub
          Pages. True for production releases; false for beta, which ships to the
          Play internal track only.
        type: boolean
        required: false
        default: false
      google-play-track:
        description: "Google Play track to upload the bundle to."
        type: string
        required: false
        default: "production"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Credentials are never substituted into a tracked file. The tracked
      # artifacts are `*.template` files with no live value in them; this renders
      # the real config into the (gitignored) path the build reads. The secret is
      # only ever referenced from this `env:` mapping, never inside the script
      # body, and the script keeps the value out of any child process argv.
      - name: Generate Android Firebase config
        env:
          ANDROID_API_KEY: ${{ secrets.ANDROID_API_KEY }}
        run: scripts/generate_build_config.sh android

      - name: Generate web Firebase config
        if: inputs.publish-web
        env:
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
        # Renders web/index.html plus config/firebase_config.json; the key is read
        # back from that file by the build below rather than passed as an argument.
        run: scripts/generate_build_config.sh web

      # Cache the pub cache before `flutter pub get` so repeat releases reuse it.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Run tests
        run: |
          flutter pub get
          flutter clean
          flutter test

      # Gradle downloads are the slowest part of an Android build. Restore them from
      # a key that covers both the Gradle configuration and the Flutter packages
      # that contribute Android code.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write JKS
        id: write_jks
        uses: timheuer/base64-to-file@v2
        with:
          fileName: sign_key.jks
          encodedString: ${{ secrets.SIGN_KEY_JKS }}

      - name: Write json
        id: write_json
        uses: timheuer/base64-to-file@v2
        with:
          fileName: access_key.json
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: bundle
        run: |
          scripts/generate_build_config.sh keystore
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons:main
          flutter build appbundle
          rm ./android/key.properties
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.write_jks.outputs.filePath }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI: true

      - name: Build web release
        if: inputs.publish-web
        # No web-enabling `flutter config` call here. Web support is on by
        # default in current Flutter, and the `web/` runner directory is committed
        # to this repo, so there is nothing left for such a flag to do. (The flag
        # is still accepted by the CLI, which is why the redundancy was silent.)
        run: |
          flutter build web --release --dart-define-from-file=config/firebase_config.json

      # NOTE: v4 renamed the v3 inputs (ACCESS_TOKEN/BRANCH/FOLDER -> lowercase,
      # and the credential input is `token`, NOT `github-token`). The classic PAT
      # is kept as the push credential to preserve the previous publish behaviour.
      - name: Deploy pages
        if: inputs.publish-web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages
          folder: build/web

      - name: Deploy google play store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.write_json.outputs.filePath }}
          packageName: com.finside.realoptions
          releaseFiles: build/app/outputs/bundle/release/app.aab
          track: ${{ inputs.google-play-track }}
          whatsNewDirectory: assets/whatsnew
