# Reusable release workflow for the RealOptions Flutter app.
#
# This is the single implementation of the release pipeline. `deploybeta.yaml` and
# `deployprod.yaml` are thin callers that differ only in the tag they match and the
# values they pass in here. Previously both files carried a full copy of the
# pipeline, which meant any change had to be made twice and silently drifted.
#
# See docs/release-flow.md for the end-to-end release process.
#
# Callers MUST use `secrets: inherit`. The required repository secrets are listed
# in docs/release-flow.md.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      flutter-version:
        description: "Flutter SDK version used to build and test the release."
        type: string
        required: false
        default: "3.47.4"
      flutter-channel:
        description: "Flutter release channel."
        type: string
        required: false
        default: "stable"
      publish-web:
        description: >-
          Insert the web API key, build the web bundle and publish it to GitHub
          Pages. True for production releases; false for beta, which ships to the
          Play internal track only.
        type: boolean
        required: false
        default: false
      google-play-track:
        description: "Google Play track to upload the bundle to."
        type: string
        required: false
        default: "production"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version authority.
      #
      # The tag that triggered this run decides the version name, and the
      # Actions run number - which only ever increases - decides the build
      # number (Android versionCode / iOS CFBundleVersion). Neither is read
      # back out of pubspec.yaml here, so the artifact carries the version of
      # the tag that caused it to be built, and no one has to hand-increment a
      # `+build` suffix before releasing. pubspec.yaml owns the semantic
      # version and feeds tag creation; this owns what ships. See
      # docs/release-flow.md.
      - name: Resolve release version
        env:
          # The tag name is text someone pushed, so it comes in through a
          # mapping and is validated before it reaches any build flag.
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APP_VERSION="${REF_NAME#*-}"
          case "$APP_VERSION" in
            # Anything outside digits and dots is refused first, so a tag cannot
            # smuggle shell metacharacters or a stray `+build` into a flag.
            *[!0-9.]*)
              echo "::error::tag '$REF_NAME' has a version with characters outside [0-9.]"
              exit 1
              ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$REF_NAME' does not carry an x.y.z version"
              exit 1
              ;;
          esac
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building version $APP_VERSION (build $RUN_NUMBER)"

      # Credentials are never substituted into a tracked file. The tracked
      # artifacts are `*.template` files with no live value in them; this renders
      # the real config into the (gitignored) path the build reads. The secret is
      # only ever referenced from this `env:` mapping, never inside the script
      # body, and the script keeps the value out of any child process argv.
      - name: Generate Android Firebase config
        env:
          ANDROID_API_KEY: ${{ secrets.ANDROID_API_KEY }}
        run: scripts/generate_build_config.sh android

      - name: Generate web Firebase config
        if: inputs.publish-web
        env:
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
        # Renders web/index.html plus config/firebase_config.json; the key is read
        # back from that file by the build below rather than passed as an argument.
        run: scripts/generate_build_config.sh web

      # `cache: true` caches both the Flutter SDK install and the pub
      # dependency set, so a release that does not change pubspec.lock reuses
      # both instead of re-downloading them. The action's step guard is
      # `(pub-cache == '' && cache == 'true') || pub-cache == 'true'`, so the
      # pub branch is taken with `pub-cache` left unset; it is not written out
      # because actionlint's bundled action metadata predates that input and
      # reports it as unknown.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-channel }}
          cache: true

      - name: Run tests
        run: |
          flutter pub get
          flutter clean
          flutter test

      # Gradle downloads are the slowest part of an Android build. Restore them from
      # a key that covers both the Gradle configuration and the Flutter packages
      # that contribute Android code.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write JKS
        id: write_jks
        uses: timheuer/base64-to-file@v2
        with:
          fileName: sign_key.jks
          encodedString: ${{ secrets.SIGN_KEY_JKS }}

      - name: Write json
        id: write_json
        uses: timheuer/base64-to-file@v2
        with:
          fileName: access_key.json
          encodedString: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: bundle
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          ANDROID_KEYSTORE_PATH: ${{ steps.write_jks.outputs.filePath }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI: true
        run: |
          scripts/generate_build_config.sh keystore
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons:main
          flutter build appbundle --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"
          rm ./android/key.properties

      - name: Build web release
        if: inputs.publish-web
        # No web-enabling `flutter config` call here. Web support is on by
        # default in current Flutter, and the `web/` runner directory is committed
        # to this repo, so there is nothing left for such a flag to do. (The flag
        # is still accepted by the CLI, which is why the redundancy was silent.)
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          flutter build web --release --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER" --dart-define-from-file=config/firebase_config.json

      # `flutter build web` emits unversioned filenames, and GitHub Pages answers
      # them with max-age=600, so without this a visitor can keep getting the
      # previous release's bootstrap - and through it the previous app - for as
      # long as that cache holds. Tagging each URL with a content hash makes every
      # deploy a cache miss for what changed and still cacheable for what did not.
      # See scripts/cache_bust_web.sh.
      - name: Cache-bust the web bundle
        if: inputs.publish-web
        run: scripts/cache_bust_web.sh build/web

      # NOTE: v4 renamed the v3 inputs (ACCESS_TOKEN/BRANCH/FOLDER -> lowercase,
      # and the credential input is `token`, NOT `github-token`). The classic PAT
      # is kept as the push credential to preserve the previous publish behaviour.
      - name: Deploy pages
        if: inputs.publish-web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages
          folder: build/web

      - name: Deploy google play store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.write_json.outputs.filePath }}
          packageName: com.finside.realoptions
          # Globbed rather than spelled out. This used to be the literal
          # `.../release/app.aab`, which matched the old AGP 3.3 output name.
          # AGP 3.5 onwards writes `app-release.aab` (build mode in the
          # filename), so the literal path would have pointed at a file that no
          # longer exists and the upload would fail on every release. Flutter's
          # own findBundleFile handles both names; the workflow now does too by
          # not committing to either. See
          # flutter/packages/flutter_tools/test/general.shard/android/gradle_find_bundle_test.dart
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.google-play-track }}
          whatsNewDirectory: assets/whatsnew
